<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typing Test</title>
<style>
:root{color-scheme:dark;--bg:#323437;--panel:#2c2e31;--ink:#d1d0c5;--muted:#646669;--accent:#e2b714;--bad:#ca4754;--line:#45474a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}.app{width:min(1060px,calc(100% - 36px));margin:auto;padding:28px 0 56px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.brand{font-size:27px;font-weight:700;letter-spacing:-1px;color:var(--accent)}.brand span{color:var(--ink);font-weight:500}.tag,.hint,.footer{color:var(--muted);font-size:13px}.settings{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;background:var(--panel);padding:8px;border-radius:9px;margin-bottom:35px}label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}select,button{font:inherit;border:0;border-radius:6px;padding:8px 9px;color:var(--ink);background:transparent;cursor:pointer}select:hover{background:#3a3c3f}button{background:var(--accent);color:#323437;font-weight:800;margin-left:5px}.custom{display:none;margin:-18px auto 25px;width:min(760px,100%)}.custom label{margin-bottom:8px}.custom textarea{height:92px}.stats{display:flex;gap:28px;min-height:40px;align-items:end;color:var(--accent);margin:0 5px 16px}.stat span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.stat strong{font-size:24px;font-weight:500}.stage{min-height:250px;padding:28px 5px 8px}.prompt{font:28px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.025em;word-spacing:.13em;white-space:pre-wrap;max-height:220px;overflow:hidden;user-select:none}.pending{color:var(--muted)}.ok{color:var(--ink)}.wrong{color:var(--bad);text-decoration:underline}.cursor{border-left:2px solid var(--accent);animation:blink 1s step-end infinite;margin-left:-1px}@keyframes blink{50%{border-color:transparent}}.progress{height:3px;background:#45474a;border-radius:9px;overflow:hidden;margin:12px 0 18px}.progress i{display:block;height:100%;background:var(--accent);width:0%;transition:width .1s}textarea{display:block;width:100%;height:76px;padding:12px;background:#292b2e;color:var(--ink);border:1px solid transparent;border-radius:7px;resize:vertical;font:17px/1.45 ui-monospace,Consolas,monospace}textarea:focus{outline:0;border-color:var(--accent)}.hint{text-align:center;margin:15px 0}.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:42px}.chart{border-top:1px solid var(--line);padding-top:14px}.chart h2{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}canvas{width:100%;height:145px}.footer{text-align:center;margin-top:28px}@media(max-width:680px){.app{width:calc(100% - 24px)}.tag{display:none}.settings{justify-content:flex-start}.stats{gap:14px;flex-wrap:wrap}.stat strong{font-size:20px}.prompt{font-size:22px;min-height:170px}.charts{grid-template-columns:1fr}.stage{min-height:210px}}
</style></head><body><main class="app">
<header class="top"><div class="brand">typing<span>test</span></div><div class="tag">type fast · type accurately</div></header>
<section class="settings"><label>mode <select id="mode"><option value="time">time</option><option value="words">words</option></select></label><label id="amountLabel">seconds <select id="amount"><option>15</option><option>30</option><option selected>60</option><option>120</option><option value="0">unlimited</option></select></label><label>content <select id="content"><option value="words">words</option><option value="numbers">numbers</option><option value="punctuation">punctuation</option><option value="mixed">mixed</option><option value="custom">custom text</option></select></label><label>case <select id="casing"><option value="lower">lower</option><option value="capitalized">capitalized</option><option value="random">random</option></select></label><button id="newTest" type="button">restart</button></section>
<section class="custom" id="customPanel"><label for="customText">CUSTOM TEXT — Enter is preserved as a line break</label><textarea id="customText" placeholder="Paste or write your practice text, then press restart."></textarea></section>
<section class="stage"><div class="stats"><div class="stat"><span id="timerLabel">time left</span><strong id="timer">60.0s</strong></div><div class="stat"><span>wpm</span><strong id="wpm">0.0</strong></div><div class="stat"><span>accuracy</span><strong id="accuracy">100.0%</strong></div><div class="stat"><span>errors</span><strong id="errors">0.0%</strong></div></div><div class="prompt" id="prompt"></div><div class="progress"><i id="bar"></i></div><textarea id="input" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="click here and start typing"></textarea><p class="hint" id="status">Timer starts on your first key. Press Esc to save and finish.</p></section>
<section class="charts"><article class="chart"><h2>Current test WPM</h2><canvas id="liveChart"></canvas></article><article class="chart"><h2>Saved WPM history</h2><canvas id="historyChart"></canvas></article></section><p class="footer">Esc ends and saves a started test · browser results stay on this device</p></main>
<script>
const WORDS=['the','be','to','of','and','in','that','have','it','for','not','with','you','this','but','from','they','we','say','her','she','typing','speed','keyboard','accuracy','practice','focus','random','learn','coding','computer','program','function','project','development','result','progress','terminal','browser'],PUNCT=['.',',','!','?',';',':','-','(',')'],$=id=>document.getElementById(id),state={text:'',start:null,timer:null,samples:[],finished:false},finite=(n,f=0)=>Number.isFinite(n)?n:f;
function cfg(){let n=Number($('amount').value);return{mode:$('mode').value,amount:finite(n,60),content:$('content').value,casing:$('casing').value}}
function token(c){let k=c.content==='mixed'?['words','numbers','punctuation'][Math.floor(Math.random()*3)]:c.content,v=k==='numbers'?String(Math.floor(Math.random()*10000)):k==='punctuation'?WORDS[Math.floor(Math.random()*WORDS.length)]+PUNCT[Math.floor(Math.random()*PUNCT.length)]:WORDS[Math.floor(Math.random()*WORDS.length)];if(c.casing==='capitalized'||c.casing==='random'&&Math.random()>.5)v=v[0].toUpperCase()+v.slice(1);return v}function build(n,c){return Array.from({length:Math.max(1,finite(n,1))},()=>token(c)).join(' ')}
function metrics(){let typed=String($('input').value||''),expected=String(state.text||''),correct=[...typed].filter((x,i)=>x===expected[i]).length,wrong=Math.max(0,typed.length-correct),elapsed=state.start?Math.max(0,finite((performance.now()-state.start)/1000)):0,accuracy=typed.length?correct/typed.length*100:100,error=typed.length?wrong/typed.length*100:0,wpm=elapsed>0?correct/5/(elapsed/60):0;return{typed,wrong,elapsed,accuracy:finite(accuracy,100),error:finite(error),wpm:finite(wpm)}}
function esc(x){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prompt(typed){let text=String(state.text||''),html='';for(let i=0;i<text.length;i++){let cls=i<typed.length?(typed[i]===text[i]?'ok':'wrong'):i===typed.length?'pending cursor':'pending';html+=`<span class="${cls}">${esc(text[i])}</span>`}$('prompt').innerHTML=html||'<span class="pending">Choose settings and press restart.</span>'}
function draw(canvas,raw,color){let values=raw.map(x=>finite(Number(x))).filter(Number.isFinite),r=finite(devicePixelRatio,1),w=Math.max(1,canvas.clientWidth*r),h=Math.max(1,canvas.clientHeight*r),x=canvas.getContext('2d');canvas.width=w;canvas.height=h;x.clearRect(0,0,w,h);if(!values.length)return;let top=Math.max(10,...values),bottom=Math.min(0,...values),range=Math.max(1,top-bottom);x.strokeStyle='#45474a';for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,h*i/4);x.lineTo(w,h*i/4);x.stroke()}x.strokeStyle=color;x.lineWidth=2*r;x.beginPath();values.slice(-80).forEach((v,i,a)=>{let px=a.length===1?w/2:i*w/(a.length-1),py=h-(v-bottom)/range*h;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
function display(){let m=metrics(),c=cfg(),unlimited=c.amount===0,remaining=unlimited?m.elapsed:Math.max(0,c.amount-m.elapsed),target=Math.max(1,String(state.text||'').length),raw=unlimited?0:c.mode==='time'?(state.start?m.elapsed/c.amount*100:0):m.typed.length/target*100,progress=Math.min(100,Math.max(0,finite(raw)));$('timerLabel').textContent=c.mode==='time'?(unlimited?'elapsed':'time left'):'elapsed';$('timer').textContent=finite(c.mode==='time'&&!unlimited?remaining:m.elapsed).toFixed(1)+'s';$('wpm').textContent=m.wpm.toFixed(1);$('accuracy').textContent=m.accuracy.toFixed(1)+'%';$('errors').textContent=m.error.toFixed(1)+'%';$('bar').style.width=progress.toFixed(1)+'%';prompt(m.typed);if(state.start){state.samples.push(m.wpm);draw($('liveChart'),state.samples,'#e2b714')}if(unlimited&&c.content!=='custom'&&m.typed.length>=target-50)state.text+=' '+build(80,c);if(c.mode==='time'&&!unlimited&&remaining<=0||c.mode==='words'&&!unlimited&&m.typed.length>=target||c.content==='custom'&&target>0&&m.typed.length>=target)finish()}
function storedHistory(){try{let d=JSON.parse(localStorage.getItem('typing-test-history')||'[]');return Array.isArray(d)?d:[]}catch{return[]}}function historyGraph(){draw($('historyChart'),storedHistory().map(x=>x.wpm),'#e2b714')}function finish(){if(state.finished||!state.start)return;state.finished=true;clearInterval(state.timer);let m=metrics();$('input').disabled=true;$('status').textContent=`Saved — ${m.wpm.toFixed(1)} WPM, ${m.accuracy.toFixed(1)}% accuracy, ${m.wrong} errors.`;let h=storedHistory();h.push({wpm:m.wpm,accuracy:m.accuracy});localStorage.setItem('typing-test-history',JSON.stringify(h.slice(-40)));historyGraph()}
function refresh(){let words=$('mode').value==='words';$('amountLabel').firstChild.textContent=words?'words ':'seconds ';$('amount').innerHTML=words?'<option>10</option><option selected>25</option><option>50</option><option>100</option><option value="0">unlimited</option>':'<option>15</option><option>30</option><option selected>60</option><option>120</option><option value="0">unlimited</option>';$('customPanel').style.display=$('content').value==='custom'?'block':'none'}function newTest(){clearInterval(state.timer);let c=cfg(),custom=$('customText').value;if(c.content==='custom'&&!custom.trim()){Object.assign(state,{text:'',start:null,samples:[],finished:false,timer:null});$('input').value='';$('input').disabled=true;$('status').textContent='Add custom text above, then press restart.';display();return}Object.assign(state,{text:c.content==='custom'?custom:build(c.mode==='words'&&c.amount?c.amount:180,c),start:null,samples:[],finished:false,timer:null});$('input').value='';$('input').disabled=false;$('status').textContent='Timer starts on your first key. Press Esc to save and finish.';display();$('input').focus()}
$('input').oninput=()=>{if(!$('input').disabled&&!state.start&&$('input').value){state.start=performance.now();state.timer=setInterval(display,100)}display()};$('input').onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();finish()}};$('newTest').onclick=newTest;$('mode').onchange=()=>{refresh();newTest()};$('content').onchange=()=>{refresh();newTest()};$('casing').onchange=newTest;onresize=()=>{draw($('liveChart'),state.samples,'#e2b714');historyGraph()};refresh();newTest();historyGraph();
</script></body></html>
